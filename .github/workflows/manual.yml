name: Playwright Tests
on:
    # This workflow is triggered manually from the Actions tab in GitHub
  workflow_dispatch:
  push:
    branches: [ main ]  # Run on pushes to the main branch
  
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write

jobs:
  regression_test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Adding markdown
      run: echo '### Hello world! 🚀' >> $GITHUB_STEP_SUMMARY
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Run the Playwright tests, failure does not cancel the workflow
    - name: Run Playwright tests
      run: npx playwright test --reporter=json
      continue-on-error: true



    - name: Generate summary
      run: node scripts/summary.js

    - name: Generate Allure Report
      run: npx allure generate
  
    - name: Run Allure Action
      uses: allure-framework/allure-action@v0
      with:
        report-directory: "./allure-report"
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 30


    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
