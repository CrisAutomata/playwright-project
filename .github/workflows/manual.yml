name: Playwright Tests
on:
    # This workflow is triggered manually from the Actions tab in GitHub
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      branch:
        description: 'Branch to run on'
        required: true
        type: string
        default: main
        
  push:
    branches: [ main ]  # Run on pushes to the main branch
  
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write

jobs:
  regression_test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    # - name: Adding markdown
    #   run: echo '### Hello world! 🚀' >> $GITHUB_STEP_SUMMARY

    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Run the Playwright tests, failure does not cancel the workflow
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    #check the results json is generated and wait for 5 seconds
    - name: Check results.json
      run: ls


    # - name: Generate summary
    #   run: node scripts/summary.mjs


    - name: Test Report
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() }}       # run this step even if previous step failed
      with:
        name: JEST Tests            # Name of the check run which will be created
        path: test-results/results.xml    # Path to test results
        reporter: jest-junit        # Format of test results



    # - name: Publish dorny/test-reporter@v2
    #   uses: dorny/test-reporter@v2
    #   if: always()
    #   with:
    #     name: Playwright Tests
    #     path: test-results/results.xml
    #     reporter: java-junit    


    # - name: Publish Test Report action-junit-report@v6
    #   uses: mikepenz/action-junit-report@v6
    #   if: success() || failure() # always run even if the previous step fails
    #   with:
    #     report_paths: '**/test-results/results.xml'



    - name: Generate Allure Report
      run: npx allure generate
  
    - name: Run Allure Action
      uses: allure-framework/allure-action@v0
      with:
        report-directory: "./allure-report"
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 30


    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
